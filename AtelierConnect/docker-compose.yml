services:
  postgres:
    image: postgres:15
    container_name: atelierconnect-db
    environment:
      POSTGRES_DB: atelierconnect_db
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "5441:5432"
    volumes:
      - atelierconnect-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d atelierconnect_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  atelierconnect-postgres-data:
