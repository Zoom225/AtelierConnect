name: AtelierConnect - Vérification full-stack

on:
  push:
    branches: [ "phase-2/refactoring-backend", "phase-3/refactoring-frontend", "develop" ]
    paths:
      - "AtelierConnect/src/**"
      - "AtelierConnect/pom.xml"
      - "AtelierConnect/frontend/**"
      - ".github/workflows/atelierconnect-backend.yml"
  pull_request:
    branches: [ "develop" ]
    paths:
      - "AtelierConnect/src/**"
      - "AtelierConnect/pom.xml"
      - "AtelierConnect/frontend/**"
      - ".github/workflows/atelierconnect-backend.yml"

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: atelierconnect_ci
          POSTGRES_USER: atelier_ci
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5441:5432
        options: >-
          --health-cmd "pg_isready -U atelier_ci -d atelierconnect_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5441/atelierconnect_ci
      POSTGRES_USER: atelier_ci
      POSTGRES_PASSWORD: ci_only_password
      RUN_POSTGRES_CONCURRENCY_TEST: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: AtelierConnect/pom.xml

      - name: Générer les identifiants éphémères du jeu de démonstration
        shell: bash
        run: |
          jwt="$(openssl rand -hex 48)"
          membre="$(openssl rand -hex 24)"
          admin="$(openssl rand -hex 24)"
          for valeur in "$jwt" "$membre" "$admin"; do echo "::add-mask::$valeur"; done
          echo "JWT_SECRET=$jwt" >> "$GITHUB_ENV"
          echo "APP_DEMO_MEMBER_PASSWORD=$membre" >> "$GITHUB_ENV"
          echo "APP_DEMO_ADMIN_PASSWORD=$admin" >> "$GITHUB_ENV"

      - name: Compilation et tests (dont concurrence PostgreSQL)
        run: mvn -B -ntp -f AtelierConnect/pom.xml clean verify

      - name: Conserver les rapports Surefire
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: AtelierConnect/target/surefire-reports/
          if-no-files-found: ignore

  frontend-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: AtelierConnect/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: AtelierConnect/frontend/package-lock.json

      - name: Installer les dépendances verrouillées
        run: npm ci

      - name: Tester le frontend Angular existant
        run: npm test

      - name: Compiler le frontend Angular existant
        run: npm run build

  browser-integration:
    # Un seul parcours navigateur par PR, sur une base PostgreSQL jetable.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: atelierconnect_browser
          POSTGRES_USER: atelier_browser
          POSTGRES_PASSWORD: browser_ci_only
        ports:
          - 5441:5432
        options: >-
          --health-cmd "pg_isready -U atelier_browser -d atelierconnect_browser"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5441/atelierconnect_browser
      POSTGRES_USER: atelier_browser
      POSTGRES_PASSWORD: browser_ci_only

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Préparer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: AtelierConnect/pom.xml

      - name: Préparer Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: AtelierConnect/frontend/package-lock.json

      - name: Générer des identifiants éphémères
        shell: bash
        run: |
          for variable in JWT_SECRET APP_DEMO_MEMBER_PASSWORD APP_DEMO_ADMIN_PASSWORD; do
            longueur=24
            if [ "$variable" = "JWT_SECRET" ]; then longueur=48; fi
            valeur="$(openssl rand -hex "$longueur")"
            echo "::add-mask::$valeur"
            echo "$variable=$valeur" >> "$GITHUB_ENV"
          done

      - name: Compiler Spring Boot sans rejouer les tests unitaires
        run: mvn -B -ntp -f AtelierConnect/pom.xml -DskipTests package

      - name: Installer Angular et Chromium de façon isolée
        shell: bash
        run: |
          npm ci --prefix AtelierConnect/frontend
          npm install --prefix AtelierConnect/frontend/e2e --no-package-lock --no-audit --no-fund
          (cd AtelierConnect/frontend/e2e && npx playwright install --with-deps chromium)

      - name: Démarrer la vraie application et exécuter Chromium
        shell: bash
        run: |
          set -euo pipefail
          java -jar AtelierConnect/target/atelierconnect-backend-0.0.1-SNAPSHOT.jar \
            > "$RUNNER_TEMP/atelier-backend.log" 2>&1 &
          BACKEND_PID=$!

          (
            cd AtelierConnect/frontend
            npm run start:4200 -- --host 127.0.0.1 \
              > "$RUNNER_TEMP/atelier-frontend.log" 2>&1
          ) &
          FRONTEND_PID=$!
          trap 'kill "$FRONTEND_PID" "$BACKEND_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:8082/api/ateliers/public >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8082/api/ateliers/public >/dev/null

          for i in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:4200/ >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail http://127.0.0.1:4200/ >/dev/null

          cd AtelierConnect/frontend/e2e
          npx playwright test --config playwright.config.ts

      - name: Journaux de démarrage en cas d'échec
        if: failure()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/atelier-backend.log" ]; then
            tail -100 "$RUNNER_TEMP/atelier-backend.log"
          fi
          if [ -f "$RUNNER_TEMP/atelier-frontend.log" ]; then
            tail -100 "$RUNNER_TEMP/atelier-frontend.log"
          fi

      - name: Conserver les traces et captures Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: |
            AtelierConnect/frontend/e2e/test-results/
            AtelierConnect/frontend/playwright-report/
          if-no-files-found: ignore
